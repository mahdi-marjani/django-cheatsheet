{% extends 'base.html' %}

{% block content %}

    <h2>{{ product.name }}</h2>
    <small>{{ product.created_at }}</small><br>
    <p>{{ product.price }} toman</p>
    <img class="w-25" src="{{ product.image.url }}" alt="{{ product.name }}" style="width: 300px;">
    <p>{{ product.description|safe }}</p>
    
    <br>
    <br>
    
    <form action="{% url 'orders:cart_add' product.id %}" method="post">
        {% csrf_token %}
        {{ form }}
        <input type="submit" value="add to cart">
    </form>

{% endblock %}
