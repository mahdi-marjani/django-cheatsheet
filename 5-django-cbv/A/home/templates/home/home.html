{% extends 'base.html' %}

{% block content %}

    <h2>Home {{ username }}</h2>

    {% for car in cars %}
        <p>
            {{ car.name }}
            <a href="{% url 'home:car_delete' car.id %}">
                Delete
            </a>
            <a href="{% url 'home:car_update' car.id %}">
                Update
            </a>
        </p>
    {% endfor %}

{% endblock %}
